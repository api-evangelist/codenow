aid: codenow
name: CodeNOW
description: >-
  CodeNOW is a Prague-based governance and execution platform for AI-scale
  software delivery — a control plane that determines how software moves through
  the SDLC regardless of whether a human or an AI agent wrote it. Founded by an
  ex-IBM team, CodeNOW provides a governed execution layer that enforces
  organizational policies and standards across human and non-human actors,
  making every action auditable, stoppable, and structurally controlled. The
  platform manages applications, components, containers, libraries, builds,
  releases, deployments, environments and Kubernetes clusters, and is available
  in cloud, on-premises, and air-gapped deployments. It exposes a versioned REST
  API (media-type versioning) authenticated with an API key, plus an official
  Model Context Protocol (MCP) server that wraps the API so AI assistants and
  agents can operate the platform directly.
